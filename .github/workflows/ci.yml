name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build manifests
        run: npm run build

      - name: Verify generated artifacts have no drift
        run: git diff --exit-code codex/ hooks/hooks.json

      - name: Verify catalog and docs sync
        run: npm run check:docs

      - name: Run diagnostic doctor
        run: node bin/setup.js --doctor

      - name: Run tests
        run: npm test
